<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <meta name="description" content="Beranda seri materi interaktif defensif tentang keamanan jaringan untuk Ethical Hacking Essentials.">
  <title>Keamanan Jaringan Interaktif · Ethical Hacking Essentials</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #07111f;
      --panel: #101f32;
      --panel-2: #14263c;
      --line: #2a405a;
      --text: #edf5ff;
      --muted: #a9bbd0;
      --cyan: #66e3dc;
      --blue: #70a9ff;
      --amber: #ffd166;
      --red: #ff8291;
      --green: #8be0ad;
      --radius: 18px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      scroll-behavior: smooth;
    }

    @media (prefers-color-scheme: light) {
      :root {
        color-scheme: light;
        --bg: #f3f7fb;
        --panel: #ffffff;
        --panel-2: #eaf1f8;
        --line: #c5d2df;
        --text: #17283b;
        --muted: #4c6075;
        --cyan: #087e83;
        --blue: #1762b0;
        --amber: #875600;
        --red: #b4233b;
        --green: #167443;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-width: 320px;
      background:
        radial-gradient(ellipse at 10% 5%, color-mix(in srgb, var(--cyan) 9%, transparent), transparent 36rem),
        radial-gradient(ellipse at 95% 22%, color-mix(in srgb, var(--blue) 8%, transparent), transparent 34rem),
        var(--bg);
      line-height: 1.65;
    }
    a { color: var(--cyan); }
    a:hover { color: var(--text); }
    button, summary { font: inherit; }
    button { color: inherit; }
    button:focus-visible, a:focus-visible, summary:focus-visible {
      outline: 3px solid var(--amber);
      outline-offset: 3px;
    }
    .wrap { width: min(1120px, calc(100% - 36px)); margin-inline: auto; }
    .topbar { padding: 18px 0; border-bottom: 1px solid color-mix(in srgb, var(--muted) 14%, transparent); }
    .topbar-inner { display: flex; justify-content: space-between; align-items: center; gap: 20px; }
    .brand { display: flex; align-items: center; gap: 10px; color: var(--text); text-decoration: none; font-size: .9rem; font-weight: 750; letter-spacing: .04em; }
    .brand-mark { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 11px; color: var(--bg); background: var(--cyan); font-weight: 900; }
    .nav { display: flex; flex-wrap: wrap; gap: 18px; font-size: .87rem; }
    .nav a { color: var(--muted); text-decoration: none; }
    .nav a:hover, .nav a[aria-current="page"] { color: var(--text); }
    .nav-note { margin: 7px 0 0; color: var(--muted); font-size: .72rem; text-align: right; }
    .hero { padding: 70px 0 40px; }
    .eyebrow { display: inline-flex; align-items: center; gap: 8px; padding: 6px 11px; border: 1px solid color-mix(in srgb, var(--cyan) 30%, transparent); border-radius: 999px; color: var(--cyan); background: color-mix(in srgb, var(--cyan) 7%, transparent); font-size: .78rem; font-weight: 750; letter-spacing: .09em; text-transform: uppercase; }
    .eyebrow::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
    h1 { max-width: 920px; margin: 20px 0 16px; font-size: clamp(2.5rem, 7vw, 5rem); line-height: 1.04; letter-spacing: -.055em; }
    h1 span { color: var(--cyan); }
    .hero-copy { max-width: 790px; color: var(--muted); font-size: clamp(1.05rem, 2vw, 1.2rem); }
    .hero-note { display: flex; gap: 12px; align-items: flex-start; max-width: 800px; margin-top: 21px; padding: 14px 16px; border-left: 3px solid var(--amber); border-radius: 0 12px 12px 0; color: var(--text); background: color-mix(in srgb, var(--amber) 8%, transparent); font-size: .94rem; }
    main { padding-bottom: 60px; }
    section { padding: 38px 0; scroll-margin-top: 18px; }
    .section-heading { max-width: 790px; margin-bottom: 22px; }
    .section-tag { margin: 0 0 6px; color: var(--cyan); font-size: .76rem; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
    h2 { margin: 0 0 9px; font-size: clamp(1.8rem, 4vw, 2.65rem); line-height: 1.14; letter-spacing: -.035em; }
    h3 { margin: 0 0 8px; font-size: 1.12rem; }
    p { margin: 0 0 14px; }
    .lead { color: var(--muted); font-size: 1.05rem; }
    .grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
    .card, .panel { border: 1px solid var(--line); border-radius: var(--radius); background: linear-gradient(145deg, color-mix(in srgb, var(--panel-2) 92%, transparent), color-mix(in srgb, var(--panel) 96%, transparent)); }
    .card { padding: 21px; }
    code { max-width: 100%; overflow-wrap: anywhere; }
    .card p:last-child { margin-bottom: 0; }
    .muted, .card p, .panel p { color: var(--muted); }
    .topic-card { display: flex; flex-direction: column; min-height: 100%; }
    .topic-card h3 { margin-top: 8px; }
    .topic-index { color: var(--cyan); font-size: .76rem; font-weight: 850; letter-spacing: .12em; }
    .topic-label { align-self: flex-start; padding: 4px 8px; border: 1px solid var(--line); border-radius: 999px; color: var(--muted); font-size: .73rem; font-weight: 750; }
    .topic-body { flex: 1; }
    .topic-meta { display: grid; gap: 6px; margin: 12px 0 18px; color: var(--muted); font-size: .84rem; }
    .topic-meta strong { color: var(--text); }
    .control { display: inline-flex; align-items: center; justify-content: center; padding: 9px 14px; border: 1px solid var(--line); border-radius: 9px; color: var(--text); background: var(--panel-2); text-decoration: none; cursor: pointer; }
    .control:hover { border-color: var(--cyan); }
    .control.primary { color: var(--bg); border-color: var(--cyan); background: var(--cyan); font-weight: 800; }
    .link-note { margin: 12px 0 0; color: var(--muted); font-size: .78rem; }
    .steps { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; counter-reset: instruction; }
    .step-card { position: relative; padding: 50px 20px 20px; }
    .step-card::before { position: absolute; top: 16px; left: 20px; counter-increment: instruction; content: "0" counter(instruction); color: var(--cyan); font-size: .78rem; font-weight: 850; letter-spacing: .1em; }
    .warning-note { margin-top: 14px; padding: 12px 14px; border: 1px solid color-mix(in srgb, var(--amber) 28%, transparent); border-radius: 12px; color: var(--text); background: color-mix(in srgb, var(--amber) 7%, transparent); font-size: .86rem; }
    .map-shell { overflow: hidden; }
    .map-top { padding: 20px 20px 0; }
    .map-top p { color: var(--muted); font-size: .88rem; }
    .map-svg { display: block; width: 100%; height: auto; min-height: 250px; }
    .map-svg .edge { fill: none; stroke: #8997a8; stroke-width: 3; }
    .map-svg .node rect { fill: var(--panel-2); stroke: var(--line); stroke-width: 2; transition: stroke .2s, fill .2s; }
    .map-svg .node text { fill: var(--text); font-family: system-ui, sans-serif; pointer-events: none; }
    .map-svg .node .title { font-size: 15px; font-weight: 800; }
    .map-svg .node .sub { fill: var(--muted); font-size: 12px; }
    .map-svg .node.attack rect { stroke: var(--red); }
    .map-svg .node.defense rect { stroke: var(--green); }
    .map-svg .node.neutral rect { stroke: #8997a8; }
    .map-svg .node { cursor: pointer; outline: none; }
    .map-svg .node:hover rect, .map-svg .node:focus rect, .map-svg .node.selected rect { fill: color-mix(in srgb, var(--cyan) 12%, var(--panel-2)); stroke: var(--cyan); }
    .map-svg .edge-label { fill: var(--muted); font-family: system-ui, sans-serif; font-size: 12px; }
    .map-svg .edge-red { fill: var(--red); }
    .map-svg .edge-green { fill: var(--green); }
    .map-info { min-height: 75px; margin: 0 20px 18px; padding: 13px 15px; border: 1px solid var(--line); border-radius: 12px; background: var(--bg); }
    .map-info strong { display: block; color: var(--text); margin-bottom: 3px; }
    .map-info p { margin: 0; color: var(--muted); font-size: .88rem; }
    .map-info a { margin-left: 6px; white-space: nowrap; }
    .text-alternative { padding: 20px; border-top: 1px solid var(--line); }
    .text-alternative h3 { font-size: 1rem; }
    .text-alternative ul { display: grid; gap: 9px; margin: 0; padding-left: 20px; color: var(--muted); }
    .text-alternative li strong { color: var(--text); }
    .order-list { display: grid; gap: 12px; margin: 0; padding: 0; list-style: none; counter-reset: learning; }
    .order-list li { display: grid; grid-template-columns: 44px 1fr; gap: 12px; align-items: start; padding: 15px; border: 1px solid var(--line); border-radius: 13px; background: var(--panel); counter-increment: learning; }
    .order-list li::before { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 10px; content: counter(learning); color: var(--bg); background: var(--cyan); font-weight: 900; }
    .order-list strong { color: var(--text); }
    .glossary { display: grid; gap: 9px; }
    details { border: 1px solid var(--line); border-radius: 12px; background: var(--panel); }
    details[open] { background: linear-gradient(145deg, color-mix(in srgb, var(--panel-2) 80%, transparent), var(--panel)); }
    summary { padding: 13px 15px; font-weight: 750; cursor: pointer; }
    details p { padding: 0 15px 13px; margin: 0; color: var(--muted); font-size: .9rem; }
    .refs { display: grid; gap: 12px; margin: 0; padding: 0; list-style: none; }
    .refs-group { margin-top: 24px; }
    .refs-group:first-of-type { margin-top: 0; }
    .refs-group h3 { margin: 0 0 7px; }
    .group-note { margin: 0 0 11px; color: var(--muted); font-size: .8rem; }
    .refs li { display: grid; grid-template-columns: 90px 1fr; gap: 12px; padding: 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); scroll-margin-top: 20px; }
    .refs strong { color: var(--cyan); }
    .refs p { margin: 4px 0 0; color: var(--muted); font-size: .86rem; }
    .refs a { overflow-wrap: anywhere; }
    .verify-note { color: var(--amber) !important; }
    .ethics { padding: 20px; border-color: color-mix(in srgb, var(--green) 35%, var(--line)); }
    .ethics h2 { color: var(--green); }
    footer { padding: 24px 0 38px; border-top: 1px solid color-mix(in srgb, var(--muted) 14%, transparent); color: var(--muted); font-size: .83rem; }
    .footer-inner { display: flex; justify-content: space-between; gap: 16px; }
    @media (max-width: 820px) {
      .grid-3, .steps { grid-template-columns: 1fr; }
      .grid-2 { grid-template-columns: 1fr; }
      .map-svg { min-height: 220px; }
    }
    @media (max-width: 620px) {
      .wrap { width: min(100% - 24px, 1120px); }
      .topbar-inner { align-items: flex-start; flex-direction: column; gap: 12px; }
      .nav { gap: 8px 14px; }
      .nav-note { text-align: left; }
      .hero { padding-top: 46px; }
      section { padding: 30px 0; }
      .refs li { grid-template-columns: 1fr; gap: 3px; }
      .footer-inner { flex-direction: column; }
      .map-svg { min-height: 0; }
      .map-svg .edge-label { font-size: 13px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
    }
